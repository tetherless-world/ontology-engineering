name: branch-multipage
on: 
  push:
    branches:
      - master
      - agentic-orchestration
      - physical-properties
      - tracking-cjf
      - ventilation-compliance
jobs:
  branch-compilation:
    runs-on: ubuntu-latest
    steps:
      - name: multipages
        uses: coderefinery/gh-pages-multibranch@main
        if: ${{ github.event_name == 'push' }}
        with:
          directory: public
          default_branch: master
          
