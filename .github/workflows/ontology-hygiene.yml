name: Ontology hygiene

on:
  push:
    branches:
      - tracking-cjf
      - 'codex/**'
  pull_request:
    branches:
      - tracking-cjf
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ontology-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: CJF ontology hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ONTPUB_SUBDIR: oe2026/tracking-cjf
      HYGIENE_NAMESPACE_REGEX: '^https:\/\/tw[.]rpi[.]edu\/ontology-engineering\/oe2026\/tracking-cjf\/'
      HYGIENE_TEST_SUBDIR: .hygiene/curated_tests_some_errors
      HYGIENE_FAIL_ON_WARNINGS: 'false'

    steps:
      - name: Check out this repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # Preserve the selected commit, including a PR's test merge commit, while
      # giving the publisher a local branch. No branch is pushed to GitHub.
      - name: Give the publisher a local branch
        run: git checkout -B hygiene-ci HEAD

      - name: Check runner tools
        run: |
          docker --version
          docker compose version
          python3 --version

      - name: Test report validation
        run: python3 -m unittest discover -s .hygiene -p 'test_*.py'

      - name: Run ontology hygiene tests
        run: bash .hygiene/run_github_actions.sh

      - name: Upload hygiene reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cjf-ontology-hygiene-results
          path: .hygiene/output/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
