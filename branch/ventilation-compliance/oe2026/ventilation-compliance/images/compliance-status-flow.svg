<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1730" viewBox="0 0 1240 1730" role="img" aria-labelledby="title desc"><title id="title">01 / Retrieve facility-area compliance status</title><desc id="desc">UML activity diagram · Proposed query workflow for an area and an assessment time</desc><defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#486477" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#19374a}.line{stroke:#486477;stroke-width:2;fill:none;marker-end:url(#a)}.guard{font-size:15px;paint-order:stroke;stroke:white;stroke-width:5px}</style>
<text x="40" y="42" text-anchor="start" font-size="28" font-weight="bold">01 / Retrieve facility-area compliance status</text>
<text x="40" y="74" text-anchor="start" font-size="16" font-weight="normal">UML activity diagram · Proposed query workflow for an area and an assessment time</text>
<text x="365" y="115" text-anchor="middle" font-size="14" font-weight="bold">MAIN FLOW</text>
<text x="975" y="115" text-anchor="middle" font-size="14" font-weight="bold">ALTERNATIVE FLOWS</text>
<circle cx="365" cy="145" r="9" fill="#19374a"/>
<path class="line" d="M365 154 V277"/>
<rect x="145.0" y="277" width="440" height="86" rx="17" fill="#edf5fc" stroke="#71899a" stroke-width="1.5"/>
<text x="365" y="314.5" text-anchor="middle" font-size="18" font-weight="normal">Staff select facility area</text>
<text x="365" y="337.5" text-anchor="middle" font-size="18" font-weight="normal">and requested time</text>
<path class="line" d="M365 363 V437"/>
<rect x="145.0" y="437" width="440" height="86" rx="17" fill="#edf5fc" stroke="#71899a" stroke-width="1.5"/>
<text x="365" y="474.5" text-anchor="middle" font-size="18" font-weight="normal">Query service resolves the area</text>
<text x="365" y="497.5" text-anchor="middle" font-size="18" font-weight="normal">in the building named graph</text>
<path class="line" d="M365 523 V590"/>
<path d="M365 590 L575 640 L365 690 L155 640 Z" fill="#f1f0fc" stroke="#7a78a4" stroke-width="1.5"/>
<text x="365" y="646.0" text-anchor="middle" font-size="17" font-weight="normal">Area found?</text>
<path class="line" d="M575 640 H785"/>
<text class="guard" x="610" y="628">[no]</text>
<rect x="785.0" y="597" width="380" height="86" rx="17" fill="#fff5e8" stroke="#71899a" stroke-width="1.5"/>
<text x="975" y="634.5" text-anchor="middle" font-size="18" font-weight="normal">Return “Area not found”</text>
<text x="975" y="657.5" text-anchor="middle" font-size="18" font-weight="normal">Request a valid area</text>
<path class="line" d="M975 683 V715"/>
<circle cx="975" cy="729" r="12" fill="white" stroke="#19374a" stroke-width="2"/><circle cx="975" cy="729" r="7" fill="#19374a"/>
<path class="line" d="M365 690 V757"/>
<text class="guard" x="379" y="726">[yes]</text>
<rect x="145.0" y="757" width="440" height="86" rx="17" fill="#edf5fc" stroke="#71899a" stroke-width="1.5"/>
<text x="365" y="794.5" text-anchor="middle" font-size="18" font-weight="normal">Retrieve applicable policies</text>
<text x="365" y="817.5" text-anchor="middle" font-size="18" font-weight="normal">from the policy named graph</text>
<path class="line" d="M365 843 V910"/>
<path d="M365 910 L575 960 L365 1010 L155 960 Z" fill="#f1f0fc" stroke="#7a78a4" stroke-width="1.5"/>
<text x="365" y="966.0" text-anchor="middle" font-size="17" font-weight="normal">Policies applicable?</text>
<path class="line" d="M575 960 H785"/>
<text class="guard" x="610" y="948">[no]</text>
<rect x="785.0" y="917" width="380" height="86" rx="17" fill="#fff5e8" stroke="#71899a" stroke-width="1.5"/>
<text x="975" y="954.5" text-anchor="middle" font-size="18" font-weight="normal">Return “Not assessed”</text>
<text x="975" y="977.5" text-anchor="middle" font-size="18" font-weight="normal">No applicable policy is modeled</text>
<path class="line" d="M975 1003 V1035"/>
<circle cx="975" cy="1049" r="12" fill="white" stroke="#19374a" stroke-width="2"/><circle cx="975" cy="1049" r="7" fill="#19374a"/>
<path class="line" d="M365 1010 V1077"/>
<text class="guard" x="379" y="1046">[yes]</text>
<rect x="145.0" y="1077" width="440" height="86" rx="17" fill="#edf5fc" stroke="#71899a" stroke-width="1.5"/>
<text x="365" y="1114.5" text-anchor="middle" font-size="18" font-weight="normal">Retrieve matching compliance records</text>
<text x="365" y="1137.5" text-anchor="middle" font-size="18" font-weight="normal">for the area and requested time</text>
<path class="line" d="M365 1163 V1230"/>
<path d="M365 1230 L575 1280 L365 1330 L155 1280 Z" fill="#f1f0fc" stroke="#7a78a4" stroke-width="1.5"/>
<text x="365" y="1274.5" text-anchor="middle" font-size="17" font-weight="normal">Reusable assessment</text>
<text x="365" y="1297.5" text-anchor="middle" font-size="17" font-weight="normal">with linked evidence?</text>
<path class="line" d="M575 1280 H785"/>
<text class="guard" x="610" y="1268">[no]</text>
<rect x="785.0" y="1237" width="380" height="86" rx="17" fill="#fff5e8" stroke="#71899a" stroke-width="1.5"/>
<text x="975" y="1274.5" text-anchor="middle" font-size="18" font-weight="normal">Invoke reasoning activity (02)</text>
<text x="975" y="1297.5" text-anchor="middle" font-size="18" font-weight="normal">Obtain status or explicit failure</text>
<path class="line" d="M975 1323 V1368 H376"/>
<path d="M365 1358 L376 1368 L365 1378 L354 1368 Z" fill="white" stroke="#486477" stroke-width="1.5"/>
<path class="line" d="M365 1330 V1358"/>
<text class="guard" x="379" y="1352">[yes]</text>
<path class="line" d="M365 1378 V1397"/>
<rect x="145.0" y="1397" width="440" height="86" rx="17" fill="#edf5fc" stroke="#71899a" stroke-width="1.5"/>
<text x="365" y="1434.5" text-anchor="middle" font-size="18" font-weight="normal">Assemble status and explanation</text>
<text x="365" y="1457.5" text-anchor="middle" font-size="18" font-weight="normal">Readings, policy references, provenance</text>
<path class="line" d="M365 1483 V1557"/>
<rect x="145.0" y="1557" width="440" height="86" rx="17" fill="#edf5fc" stroke="#71899a" stroke-width="1.5"/>
<text x="365" y="1594.5" text-anchor="middle" font-size="18" font-weight="normal">Present area, assessment time,</text>
<text x="365" y="1617.5" text-anchor="middle" font-size="18" font-weight="normal">status, evidence, and any limitations</text>
<path class="line" d="M365 1643 V1676"/>
<circle cx="365" cy="1690" r="12" fill="white" stroke="#19374a" stroke-width="2"/><circle cx="365" cy="1690" r="7" fill="#19374a"/>
<text x="40" y="1715" text-anchor="start" font-size="14" font-weight="normal">Reuse requires matching time, building/policy versions, and relevant readings. Errors are reported explicitly, never as compliance.</text>
</svg>