<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="2210" viewBox="0 0 1240 2210" role="img" aria-labelledby="title desc"><title id="title">02 / Infer compliance and supporting evidence</title><desc id="desc">UML activity diagram · Invoked when no reusable assessment is available</desc><defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#486477" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#19374a}.line{stroke:#486477;stroke-width:2;fill:none;marker-end:url(#a)}.guard{font-size:15px;paint-order:stroke;stroke:white;stroke-width:5px}</style>
<text x="40" y="42" text-anchor="start" font-size="28" font-weight="bold">02 / Infer compliance and supporting evidence</text>
<text x="40" y="74" text-anchor="start" font-size="16" font-weight="normal">UML activity diagram · Invoked when no reusable assessment is available</text>
<text x="365" y="115" text-anchor="middle" font-size="14" font-weight="bold">MAIN FLOW</text>
<text x="975" y="115" text-anchor="middle" font-size="14" font-weight="bold">ALTERNATIVE FLOWS</text>
<circle cx="365" cy="145" r="9" fill="#19374a"/>
<path class="line" d="M365 154 V277"/>
<rect x="145.0" y="277" width="440" height="86" rx="17" fill="#edf5fc" stroke="#71899a" stroke-width="1.5"/>
<text x="365" y="314.5" text-anchor="middle" font-size="18" font-weight="normal">Receive resolved area, requested time,</text>
<text x="365" y="337.5" text-anchor="middle" font-size="18" font-weight="normal">and applicable policy references</text>
<path class="line" d="M365 363 V437"/>
<rect x="145.0" y="437" width="440" height="86" rx="17" fill="#edf5fc" stroke="#71899a" stroke-width="1.5"/>
<text x="365" y="474.5" text-anchor="middle" font-size="18" font-weight="normal">Load building context and constraints</text>
<text x="365" y="497.5" text-anchor="middle" font-size="18" font-weight="normal">from the isolated static named graphs</text>
<path class="line" d="M365 523 V597"/>
<rect x="145.0" y="597" width="440" height="86" rx="17" fill="#edf5fc" stroke="#71899a" stroke-width="1.5"/>
<text x="365" y="634.5" text-anchor="middle" font-size="18" font-weight="normal">Retrieve sensor nanopublications</text>
<text x="365" y="657.5" text-anchor="middle" font-size="18" font-weight="normal">for the area and assessment time</text>
<path class="line" d="M365 683 V750"/>
<path d="M365 750 L575 800 L365 850 L155 800 Z" fill="#f1f0fc" stroke="#7a78a4" stroke-width="1.5"/>
<text x="365" y="794.5" text-anchor="middle" font-size="17" font-weight="normal">Required observations</text>
<text x="365" y="817.5" text-anchor="middle" font-size="17" font-weight="normal">usable and sufficient?</text>
<path class="line" d="M575 800 H785"/>
<text class="guard" x="610" y="788">[no]</text>
<rect x="785.0" y="757" width="380" height="86" rx="17" fill="#fff5e8" stroke="#71899a" stroke-width="1.5"/>
<text x="975" y="794.5" text-anchor="middle" font-size="18" font-weight="normal">Return “Indeterminate”</text>
<text x="975" y="817.5" text-anchor="middle" font-size="18" font-weight="normal">Identify missing or unusable evidence</text>
<path class="line" d="M975 843 V875"/>
<circle cx="975" cy="889" r="12" fill="white" stroke="#19374a" stroke-width="2"/><circle cx="975" cy="889" r="7" fill="#19374a"/>
<path class="line" d="M365 850 V917"/>
<text class="guard" x="379" y="886">[yes]</text>
<rect x="145.0" y="917" width="440" height="86" rx="17" fill="#edf5fc" stroke="#71899a" stroke-width="1.5"/>
<text x="365" y="954.5" text-anchor="middle" font-size="18" font-weight="normal">Construct symbolic building state</text>
<text x="365" y="977.5" text-anchor="middle" font-size="18" font-weight="normal">Bind observations to policy constraints</text>
<path class="line" d="M365 1003 V1077"/>
<rect x="145.0" y="1077" width="440" height="86" rx="17" fill="#edf5fc" stroke="#71899a" stroke-width="1.5"/>
<text x="365" y="1114.5" text-anchor="middle" font-size="18" font-weight="normal">Evaluate the applicable constraints</text>
<text x="365" y="1137.5" text-anchor="middle" font-size="18" font-weight="normal">with the symbolic reasoner</text>
<path class="line" d="M365 1163 V1230"/>
<path d="M365 1230 L575 1280 L365 1330 L155 1280 Z" fill="#f1f0fc" stroke="#7a78a4" stroke-width="1.5"/>
<text x="365" y="1274.5" text-anchor="middle" font-size="17" font-weight="normal">Evaluation completed</text>
<text x="365" y="1297.5" text-anchor="middle" font-size="17" font-weight="normal">with determinate results?</text>
<path class="line" d="M575 1280 H785"/>
<text class="guard" x="610" y="1268">[no]</text>
<rect x="785.0" y="1237" width="380" height="86" rx="17" fill="#fff5e8" stroke="#71899a" stroke-width="1.5"/>
<text x="975" y="1274.5" text-anchor="middle" font-size="18" font-weight="normal">Return “Unable to determine”</text>
<text x="975" y="1297.5" text-anchor="middle" font-size="18" font-weight="normal">Explain solver failure or uncertainty</text>
<path class="line" d="M975 1323 V1355"/>
<circle cx="975" cy="1369" r="12" fill="white" stroke="#19374a" stroke-width="2"/><circle cx="975" cy="1369" r="7" fill="#19374a"/>
<path class="line" d="M365 1330 V1390"/>
<text class="guard" x="379" y="1366">[yes]</text>
<path d="M365 1390 L575 1440 L365 1490 L155 1440 Z" fill="#f1f0fc" stroke="#7a78a4" stroke-width="1.5"/>
<text x="365" y="1434.5" text-anchor="middle" font-size="17" font-weight="normal">Any evaluated requirement</text>
<text x="365" y="1457.5" text-anchor="middle" font-size="17" font-weight="normal">violated?</text>
<path class="line" d="M575 1440 H785"/>
<text class="guard" x="610" y="1428">[yes]</text>
<rect x="785.0" y="1397" width="380" height="86" rx="17" fill="#fff5e8" stroke="#71899a" stroke-width="1.5"/>
<text x="975" y="1434.5" text-anchor="middle" font-size="18" font-weight="normal">Set status to “Violated”</text>
<text x="975" y="1457.5" text-anchor="middle" font-size="18" font-weight="normal">Identify unmet requirements</text>
<path class="line" d="M975 1483 V1528 H376"/>
<path d="M365 1518 L376 1528 L365 1538 L354 1528 Z" fill="white" stroke="#486477" stroke-width="1.5"/>
<path class="line" d="M365 1490 V1518"/>
<text class="guard" x="379" y="1512">[all satisfied]</text>
<path class="line" d="M365 1538 V1557"/>
<rect x="145.0" y="1557" width="440" height="86" rx="17" fill="#edf5fc" stroke="#71899a" stroke-width="1.5"/>
<text x="365" y="1594.5" text-anchor="middle" font-size="18" font-weight="normal">Assemble assessment and explanation</text>
<text x="365" y="1617.5" text-anchor="middle" font-size="18" font-weight="normal">Link readings, constraints, and provenance</text>
<path class="line" d="M365 1643 V1717"/>
<rect x="145.0" y="1717" width="440" height="86" rx="17" fill="#edf5fc" stroke="#71899a" stroke-width="1.5"/>
<text x="365" y="1754.5" text-anchor="middle" font-size="18" font-weight="normal">Publish compliance nanopublication</text>
<text x="365" y="1777.5" text-anchor="middle" font-size="18" font-weight="normal">Include assessment time and input versions</text>
<path class="line" d="M365 1803 V1870"/>
<path d="M365 1870 L575 1920 L365 1970 L155 1920 Z" fill="#f1f0fc" stroke="#7a78a4" stroke-width="1.5"/>
<text x="365" y="1926.0" text-anchor="middle" font-size="17" font-weight="normal">Publication successful?</text>
<path class="line" d="M575 1920 H785"/>
<text class="guard" x="610" y="1908">[no]</text>
<rect x="785.0" y="1877" width="380" height="86" rx="17" fill="#fff5e8" stroke="#71899a" stroke-width="1.5"/>
<text x="975" y="1914.5" text-anchor="middle" font-size="18" font-weight="normal">Return result marked “Not persisted”</text>
<text x="975" y="1937.5" text-anchor="middle" font-size="18" font-weight="normal">Report publication failure</text>
<path class="line" d="M975 1963 V1995"/>
<circle cx="975" cy="2009" r="12" fill="white" stroke="#19374a" stroke-width="2"/><circle cx="975" cy="2009" r="7" fill="#19374a"/>
<path class="line" d="M365 1970 V2037"/>
<text class="guard" x="379" y="2006">[yes]</text>
<rect x="145.0" y="2037" width="440" height="86" rx="17" fill="#edf5fc" stroke="#71899a" stroke-width="1.5"/>
<text x="365" y="2074.5" text-anchor="middle" font-size="18" font-weight="normal">Return status, evidence,</text>
<text x="365" y="2097.5" text-anchor="middle" font-size="18" font-weight="normal">and nanopublication identifier</text>
<path class="line" d="M365 2123 V2156"/>
<circle cx="365" cy="2170" r="12" fill="white" stroke="#19374a" stroke-width="2"/><circle cx="365" cy="2170" r="7" fill="#19374a"/>
<text x="40" y="2195" text-anchor="start" font-size="14" font-weight="normal">Satisfied means all applicable evaluated requirements pass. This proposed flow treats insufficient evidence as indeterminate.</text>
</svg>